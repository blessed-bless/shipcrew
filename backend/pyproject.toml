[project]
name = "shipcrew"
version = "0.1.0"
description = "Multi-agent platform that ships tasks to a prod-ready bundle"
requires-python = ">=3.12"
authors = [{ name = "Богдан Щербинин" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: RU UX copy and long runner notes stay readable
# UP042: keep str, Enum for pydantic/json compatibility without StrEnum churn
ignore = ["B008", "UP046", "UP047", "E501", "UP042"]

[tool.ruff.format]
quote-style = "double"
